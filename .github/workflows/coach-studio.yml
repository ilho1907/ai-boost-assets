name: Coach-Studio

# Läuft für Änderungen am Coach-Studio-Modul. Die statische Landingpage im
# Repo-Wurzelverzeichnis hat keinen Build und braucht diesen Workflow nicht.
on:
  push:
    paths:
      - 'coach-studio/**'
      - '.github/workflows/coach-studio.yml'
  pull_request:
    paths:
      - 'coach-studio/**'
      - '.github/workflows/coach-studio.yml'

defaults:
  run:
    working-directory: coach-studio

jobs:
  typecheck-und-tests:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coach-studio/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit-Tests
        run: npm test

      - name: Produktionsbuild
        run: npx vite build

  schema:
    name: Schema gegen PostgreSQL 16
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Kein Service-Container: supabase/tests/run.sh startet sich eine eigene
      # Wegwerf-Instanz, damit derselbe Befehl lokal und in der CI gilt.
      - name: PostgreSQL 16 bereitstellen
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi

      # Die Suite läuft bewusst als Nicht-Superuser — Superuser umgehen RLS.
      # Der GitHub-Runner arbeitet als `runner`, nicht als root, das passt.
      - name: Verifikationssuite
        run: ./supabase/tests/run.sh
